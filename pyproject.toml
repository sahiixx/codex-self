[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-self"
version = "2.0.0"
description = "Self-aware Codex CLI agent identity and runtime service for the SAHIIXX ecosystem."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psutil>=6.0",
    "aiofiles>=24.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "coverage>=7.5",
]

[project.scripts]
codex-self = "codex_self.main:cli_entry"

[tool.pytest.ini_options]
testpaths = ["tests"]
